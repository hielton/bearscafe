spring.application.name=bearscafe-backend

# PostgreSQL database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}

#JWT authentication
jwt.secret=${JWT_SECRET}

# Meal image uploads
app.upload.dir=${UPLOAD_DIR:uploads/dishes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.cors=INFO

# USDA FoodData Central
usda.api.key=${USDA_API_KEY}
usda.api.base-url=https://api.nal.usda.gov/fdc/v1

# Google Gemini API
gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.api.model=gemini-3.5-flash-lite